name: Récupération des cours

on:
  schedule:
    # Deux passages par heure, à des minutes « creuses » (GitHub retarde ou saute les tâches lancées à :00).
    # Le 2e passage est un RATTRAPAGE : il s'arrête tout de suite si le chargement de l'heure est déjà complet
    # (journal_chargements_cours) et sinon ne traite que ce qui manque.
    - cron: "11 * * * *"
    - cron: "41 * * * *"
  workflow_dispatch: {}   # permet de lancer le job manuellement depuis l'onglet Actions

# Un seul run à la fois : si un run dépasse l'heure, le suivant attend au lieu de se chevaucher.
concurrency:
  group: recuperer-cours
  cancel-in-progress: false

jobs:
  recuperer-cours:
    runs-on: ubuntu-24.04      # version fixée (ubuntu-latest passe à Ubuntu 26 le 19/10/2026)
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Récupération des cours
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python recuperer_cours.py
