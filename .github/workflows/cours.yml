name: Récupération des cours

on:
  schedule:
    # Toutes les heures, à :00
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permet de lancer le job manuellement depuis l'onglet Actions

# Un seul run à la fois : si un run dépasse l'heure, le suivant attend au lieu de se chevaucher.
concurrency:
  group: recuperer-cours
  cancel-in-progress: false

jobs:
  recuperer-cours:
    runs-on: ubuntu-24.04      # version fixée (ubuntu-latest passe à Ubuntu 26 le 19/10/2026)
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Récupération des cours
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python recuperer_cours.py
