name: Recuperation des cours
on: {schedule: [{cron: "5 * * * *"}], workflow_dispatch: {}}
jobs: {recuperer-cours: {runs-on: ubuntu-latest, timeout-minutes: 20, steps: [{name: Checkout, uses: "actions/checkout@v4"}, {name: Python, uses: "actions/setup-python@v5", with: {python-version: "3.11"}}, {name: Dependances, run: "pip install -r requirements.txt"}, {name: "Recuperation des cours", env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}"}, run: "python recuperer_cours.py"}]}}
